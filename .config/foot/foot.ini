[main]
font=Google Sans Code:size=11, Hack Nerd Font Mono:size=12
line-height=14
letter-spacing=0
underline-offset=3
pad=32x32

[scrollback]
lines=10000

[cursor]
style=underline
blink=yes
underline-thickness=3

[colors-dark]
alpha=0.92

[key-bindings]
search-start=Control+Shift+f

[csd]
preferred=none
