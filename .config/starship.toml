"$schema" = 'https://starship.rs/config-schema.json'

palette = 'noctalia'

format = """
[](peach)\
$os\
$username\
[](bg:yellow fg:peach)\
$directory\
[](fg:yellow bg:cyan)\
$git_branch\
$git_status\
[](fg:cyan bg:blue)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:blue bg:overlay2)\
$docker_context\
$conda\
$pixi\
[](fg:overlay2 bg:surface2)\
$time\
[ ](fg:surface2)\
$line_break$character"""

[os]
disabled = false
style = "bg:peach fg:black"

[os.symbols]
NixOS = ""
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:peach fg:black"
style_root = "bg:peach fg:black"
format = '[ $user ]($style)'

[directory]
style = "fg:black bg:yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:cyan"
format = '[[ $symbol $branch ](fg:black bg:cyan)]($style)'

[git_status]
style = "bg:cyan"
format = '[[($all_status$ahead_behind )](fg:black bg:cyan)]($style)'

[nodejs]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:black bg:blue)]($style)'

[bun]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:black bg:blue)]($style)'

[c]
symbol = " "
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:black bg:blue)]($style)'

[cpp]
symbol = " "
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:black bg:blue)]($style)'

[rust]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:black bg:blue)]($style)'

[golang]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:black bg:blue)]($style)'

[php]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:black bg:blue)]($style)'

[java]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:black bg:blue)]($style)'

[kotlin]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:black bg:blue)]($style)'

[haskell]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:black bg:blue)]($style)'

[python]
symbol = ""
style = "bg:blue"
format = '[[ $symbol( $version) ](fg:black bg:blue)]($style)'

[docker_context]
symbol = ""
style = "bg:overlay2"
format = '[[ $symbol( $context) ](fg:#83a598 bg:overlay2)]($style)'

[conda]
style = "bg:overlay2"
format = '[[ $symbol( $environment) ](fg:#83a598 bg:overlay2)]($style)'

[pixi]
style = "bg:overlay2"
format = '[[ $symbol( $version)( $environment) ](fg:black bg:overlay2)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:surface2"
format = '[[  $time ](fg:black bg:surface2)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:mauve)'
vimcmd_replace_symbol = '[❮](bold fg:mauve)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

# Noctalia Starship Palette (wallpaper-based)
# Generated by Noctalia - do not edit manually

[palettes.noctalia]
# Standard colors
blue      = "#ffb4a9"
red       = "#ffb4ab"
green     = "#e7bdb7"
yellow    = "#dec38c"
cyan      = "#e7bdb7"
magenta   = "#ffb4a9"
white     = "#e2e2e2"
black     = "#131313"

# Extended palette (Catppuccin-compatible names)
rosewater = "#dec38c"
flamingo  = "#dec38c"
pink      = "#ffb4a9"
mauve     = "#9c4237"
maroon    = "#ffb4ab"
peach     = "#dec38c"
teal      = "#e7bdb7"
sky       = "#e7bdb7"
sapphire  = "#e7bdb7"
lavender  = "#9c4237"

# Text shades
text      = "#e2e2e2"
subtext1  = "#c6c6c6"
subtext0  = "#919191"

# Surface shades
overlay2  = "#919191"
overlay1  = "#c6c6c6"
overlay0  = "#474747"
surface2  = "#474747"
surface1  = "#131313"
surface0  = "#131313"
base      = "#131313"
mantle    = "#131313"
crust     = "#3e2e04"
